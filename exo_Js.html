<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>exo_Introduction_Js</title>
</head>
<body>
<form action="/soumettre-formulaire" method="POST">
    <div>
        <label for="nom">Nom :</label>
        <input type="text" id="nom" name="nom" required placeholder="ton nom">
    </div>

    <div>
        <label for="prenom">Prénom :</label>
        <input type="text" id="prenom" name="prenom" required placeholder="ton prénom">
    </div>

    <div>
        <label for="dateNaissance">Date de naissance :</label>
        <input type="date" id="dateNaissance" name="dateNaissance" required>
    </div>

    <button type="submit" id="monBouton" class="value">Envoyer</button>
</form>

<script>
    let btn = document.querySelector(".value");
    btn.addEventListener("click",(event) =>{
        event.preventDefault()

        function calculerAge() {
            const dateNaissance = document.getElementById("dateNaissance").valueAsDate;
            const aujourdHui = new Date();

            let age = aujourdHui.getFullYear() - dateNaissance.getFullYear();
            const mois = aujourdHui.getMonth() - dateNaissance.getMonth();
            const jour = aujourdHui.getDate() - dateNaissance.getDate();


            //Vérifie si l'anniversaire est déjà passé et retire 1 an à l'âge calculé
            // si ce n'est pas le cas (Incrémentation)

            if (mois < 0 || (mois === 0 && jour < 0)) age--;

            return age;
        }

        let nom= document.querySelector("#nom").value;
        let prenom= document.querySelector("#prenom").value;
        let age = calculerAge();
        alert("Bonjour: \n" +nom+ "\n" +prenom+ "\n" +age+ "ans.");
    })




</script>

</body>
</html>

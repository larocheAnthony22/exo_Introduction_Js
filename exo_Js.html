<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>exo_Introduction_Js</title>
</head>
<body>
<form action="/soumettre-formulaire" method="POST">
    <div>
        <label for="nom">Nom :</label>
        <input type="text" id="nom" name="nom" required placeholder="ton nom">
    </div>

    <div>
        <label for="prenom">Prénom :</label>
        <input type="text" id="prenom" name="prenom" required placeholder="ton prénom">
    </div>

    <div>
        <label for="ageAnnif">Date de naissance :</label>
    <input type="date" id="ageAnnif" name="ageAnnif" required>
    </div>

    <button type="submit" id="monBouton" class="value">Envoyer</button>
</form>

<script>
    let btn = document.querySelector(".value");
    btn.addEventListener("click",(event) =>
    {
        event.preventDefault()

        function calculerAge() {
            const age2 = document.getElementById("ageAnnif").valueAsDate;
            const aujourdHui = new Date();

            let age = aujourdHui.getFullYear() - age2.getFullYear();
            const mois = aujourdHui.getMonth() - age2.getMonth();
            const jour = aujourdHui.getDate() - age2.getDate();


            //Vérifie si l'anniversaire est déjà passé et retire 1 an à l'âge calculé
            // si ce n'est pas le cas (Incrémentation)

            if (mois < 0 || (mois === 0 && jour < 0)) age--;

            return age;
        }

        let nom= document.querySelector("#nom").value;
        let prenom= document.querySelector("#prenom").value;
        let age = calculerAge();
        alert(`Bonjour ${nom} ${prenom}, vous avez ${age} ans.`);
    })

</script>

</body>
</html>
